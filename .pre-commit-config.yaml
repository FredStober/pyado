repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-yaml
  - id: check-toml
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args:
    - --autofix
  - id: pretty-format-toml
    args:
    - --autofix

- repo: https://github.com/Yelp/detect-secrets
  rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # frozen: v1.5.0
  hooks:
  - id: detect-secrets
    args: [--baseline, .secrets.baseline]

- repo: local
  hooks:
  - id: ruff-format
    name: ruff format
    entry: uv
    language: system
    pass_filenames: false
    always_run: true
    args: [run, ruff, format, --force-exclude]

  - id: ruff-check
    name: ruff check
    entry: uv
    language: system
    pass_filenames: false
    always_run: true
    args: [run, ruff, check, --fix]

  # The four soupsieve advisories below are ignored on purpose:
  #  - soupsieve is not a pyado dependency.  It is only pulled in by the docs
  #    group (furo -> beautifulsoup4 -> soupsieve) and is never installed for
  #    users of the package or imported by pyado.
  #  - All four are denial-of-service issues (CSS parser recursion, ReDoS,
  #    quadratic matching) that need an attacker to supply CSS selectors or
  #    HTML to soupsieve.  Sphinx only runs it over our own docs and theme, in
  #    a local or CI docs build, so there is no untrusted input.
  #  - The complete fix is soupsieve >= 4.0.0, which needs Python >= 3.11.5,
  #    but pyado supports Python >= 3.11.  An upgrade would split the lock file
  #    by Python version for a docs-only tool.
  # Revisit when furo/beautifulsoup4 release versions that pull in a fixed
  # soupsieve, or when requires-python is raised to >= 3.11.5, then drop these.
  - id: uv-audit
    name: uv audit
    entry: uv
    language: system
    pass_filenames: false
    always_run: true
    args:
    - audit
    - --ignore=GHSA-7g44-g9rc-x53w    # soupsieve: CSS parser recursion
    - --ignore=GHSA-mmhr-3c5m-f64f    # soupsieve: descendant combinator DoS
    - --ignore=GHSA-6655-6qjp-jx7x    # soupsieve: selector compilation ReDoS
    - --ignore=GHSA-4j63-6c4x-wfg4    # soupsieve: :has() sibling combinator DoS

  - id: mypy
    name: mypy
    entry: uv
    language: system
    types: [python]
    require_serial: true
    args: [run, mypy]

  - id: ty
    name: ty
    entry: uv
    language: system
    types: [python]
    require_serial: true
    pass_filenames: false
    args: [run, ty, check, src]

  - id: sphinx
    name: sphinx
    entry: uv
    args: [run, --group=docs, sphinx-build, -W, docs, docs/_build/html]
    language: system
    pass_filenames: false
    always_run: true

  - id: pytest
    name: pytest
    entry: uv
    language: system
    pass_filenames: false
    always_run: true
    args: [run, pytest]
